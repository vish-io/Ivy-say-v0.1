name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore IvySay/IvySay.csproj
      - run: dotnet build IvySay/IvySay.csproj -c Release --no-restore
      - run: dotnet test IvySay.Tests/IvySay.Tests.csproj -c Release
      - run: dotnet publish IvySay/IvySay.csproj -c Release -r win-x64 --self-contained true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: IvySay-win-x64
          path: publish/
          if-no-files-found: error
