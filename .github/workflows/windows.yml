name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore IvySay/IvySay.csproj
      - run: dotnet build IvySay/IvySay.csproj -c Release --no-restore
      - run: dotnet test IvySay.Tests/IvySay.Tests.csproj -c Release
      - name: Smoke test Settings window on Windows
        shell: pwsh
        run: |
          dotnet build IvySay.UiSmoke/IvySay.UiSmoke.csproj -c Release *> build-smoke.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build-smoke.log | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "ivy-ui-smoke"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $proc = Start-Process dotnet -ArgumentList 'IvySay.UiSmoke/bin/Release/net8.0-windows/IvySay.UiSmoke.dll' -NoNewWindow -PassThru -RedirectStandardOutput smoke-out.log -RedirectStandardError smoke-err.log
          if (-not $proc.WaitForExit(30000)) { Stop-Process -Id $proc.Id -Force; throw "Settings UI smoke test timed out" }
          Get-Content smoke-out.log
          if ($proc.ExitCode -ne 0) {
            Get-Content smoke-err.log | ForEach-Object { Write-Output "::error::$_" }
            throw "Settings UI smoke test failed: $($proc.ExitCode)"
          }
      - run: dotnet publish IvySay/IvySay.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Verify executable is included
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/IvySay.exe")) { throw "IvySay.exe is missing from the published output" }
          Get-Item "publish/IvySay.exe" | Format-List Name,Length,FullName
      - uses: actions/upload-artifact@v4
        with:
          name: IvySay-win-x64
          path: publish/
          if-no-files-found: error
